name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black isort ruff bandit pip-audit anyio

      - name: Run Code Formatting Checks (Black)
        run: black --check .

      - name: Run Import Sorting Checks (isort)
        run: isort --check-only .

      - name: Run Linting (Ruff)
        run: ruff check .

      - name: Run Security Scan (Bandit)
        run: bandit -r app/ -ll -s B324,B608

      - name: Scan Dependencies (pip-audit)
        run: pip-audit --local

      - name: Run Tests with Coverage
        run: |
          python -m pytest --cov=app --cov-report=html --cov-report=xml --cov-report=term-missing tests/

      - name: Upload HTML Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage
          path: backend/htmlcov/

      - name: Upload XML Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: xml-coverage
          path: backend/coverage.xml
