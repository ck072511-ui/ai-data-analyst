name: Performance Load & Benchmarks Scans

on:
  workflow_dispatch:
    inputs:
      vus:
        description: 'Number of Concurrent Virtual Users'
        required: false
        default: '5'
      duration:
        description: 'Benchmark Duration (e.g. 20s)'
        required: false
        default: '20s'

jobs:
  performance-benchmarks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install psutil anyio pytest requests

      - name: Setup Mock DB and Run Benchmark Runner
        run: |
          # Runs benchmark_suite to test baseline outcomes and save reports
          python load-tests/benchmark_suite.py
        env:
          VUS: ${{ github.event.inputs.vus }}

      - name: Upload Benchmarks JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: load-tests/reports/performance_results.json

      - name: Upload Benchmarks Markdown Report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: load-tests/reports/benchmark_report.md
