services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_analyst_db
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: analytics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/data/sample_data.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analytics_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai_network

  redis:
    image: redis:7-alpine
    container_name: ai_analyst_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - ai_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_analyst_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://analyst:secure_password@postgres:5432/analytics_db
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:-development-secret-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - ai_network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_analyst_celery_worker
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://analyst:secure_password@postgres:5432/analytics_db
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:-development-secret-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - ai_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_analyst_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - ai_network

  prometheus:
    image: prom/prometheus:latest
    container_name: ai_analyst_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - ai_network

  grafana:
    image: grafana/grafana:latest
    container_name: ai_analyst_grafana
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
